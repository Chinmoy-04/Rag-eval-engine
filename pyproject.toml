[project]
name = "rag-eval-engine"
version = "0.1.0"
description = "High-throughput RAG evaluation engine with synthetic test sets and Ragas metrics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "litellm>=1.40.0",
    "llama-index>=0.11.0",
    "llama-index-retrievers-bm25>=0.3.0",
    "llama-index-vector-stores-chroma>=0.2.0",
    "chromadb>=0.5.0",
    "ragas>=0.2.0",
    "sqlmodel>=0.0.22",
    "tenacity>=8.3.0",
    "tqdm>=4.66.0",
    "pypdf>=4.0.0",
    "rapidfuzz>=3.14.5",
    "python-docx>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
